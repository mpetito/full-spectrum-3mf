name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install slicer runtime dependencies
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libglib2.0-0 \
            libfontconfig1 libxkbcommon0 libdbus-1-3 > /dev/null 2>&1

      - name: Download BambuStudio AppImage
        id: bambu
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Download latest Linux AppImage from BambuStudio releases
          gh release download --repo bambulab/BambuStudio \
            --pattern '*linux*.AppImage' \
            --dir /tmp/bambu \
            --skip-existing || exit 1

          APPIMAGE=$(find /tmp/bambu -name '*.AppImage' | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found"
            exit 1
          fi

          chmod +x "$APPIMAGE"
          cd /tmp/bambu
          "$APPIMAGE" --appimage-extract

          # Find the AppRun wrapper (handles LD_LIBRARY_PATH natively)
          APPDIR=/tmp/bambu/squashfs-root
          if [ -x "$APPDIR/AppRun" ]; then
            echo "Found AppRun wrapper"
            echo "BAMBUSTUDIO_BIN=$APPDIR/AppRun" >> "$GITHUB_ENV"
          else
            # Fallback: find the binary directly
            BAMBU_BIN=$(find "$APPDIR" -name 'bambu-studio' -type f | head -1)
            if [ -z "$BAMBU_BIN" ]; then
              BAMBU_BIN=$(find "$APPDIR" -name 'BambuStudio' -type f | head -1)
            fi
            if [ -z "$BAMBU_BIN" ]; then
              echo "Could not find BambuStudio binary in extracted AppImage"
              find "$APPDIR/usr/bin/" -type f || true
              exit 1
            fi
            echo "Found BambuStudio at: $BAMBU_BIN"
            echo "BAMBUSTUDIO_BIN=$BAMBU_BIN" >> "$GITHUB_ENV"
          fi

      - name: Run tests
        run: |
          pytest --tb=short -v --cov=full_spectrum --cov-report=term-missing -k "not slicer"

      - name: Run slicer E2E tests
        if: env.BAMBUSTUDIO_BIN != ''
        continue-on-error: true
        run: |
          pytest --tb=short -v -m slicer
