name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest --tb=short -v --cov=full_spectrum --cov-report=term-missing

  slicer:
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install slicer runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libglib2.0-0 \
            libfontconfig1 libxkbcommon0 libdbus-1-3 libgtk-3-0 \
            gstreamer1.0-plugins-base libgstreamer-plugins-base1.0-0 \
            libsoup2.4-1 libsecret-1-0 libnotify4 libosmesa6 \
            libwebkit2gtk-4.0-37 libjavascriptcoregtk-4.0-18 \
            ffmpeg libavcodec-extra > /dev/null 2>&1

      - name: Download BambuStudio AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo bambulab/BambuStudio \
            --pattern '*linux*.AppImage' \
            --dir /tmp/bambu \
            --skip-existing

          APPIMAGE=$(find /tmp/bambu -name '*.AppImage' | head -1)
          chmod +x "$APPIMAGE"
          cd /tmp/bambu
          "$APPIMAGE" --appimage-extract

          # Prefer AppRun wrapper for proper lib resolution
          APPDIR=/tmp/bambu/squashfs-root
          if [ -x "$APPDIR/AppRun" ]; then
            echo "BAMBUSTUDIO_BIN=$APPDIR/AppRun" >> "$GITHUB_ENV"
          else
            BAMBU_BIN=$(find "$APPDIR" -name 'bambu-studio' -o -name 'BambuStudio' | head -1)
            echo "BAMBUSTUDIO_BIN=$BAMBU_BIN" >> "$GITHUB_ENV"
          fi

          # Show any remaining missing libraries
          BIN=$(find "$APPDIR" -name 'bambu-studio' -type f | head -1)
          echo "=== Missing shared libraries ==="
          ldd "$BIN" 2>&1 | grep "not found" || echo "All libraries resolved!"

      - name: Run slicer E2E tests
        run: |
          pytest --tb=short -v -m slicer
