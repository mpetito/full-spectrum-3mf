[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "full-spectrum"
version = "0.1.0"
description = "Slicer-agnostic CLI for Full Spectrum 3D printing — Z-layer color dithering for 3MF files"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "trimesh>=4.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "click>=8.0",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
full-spectrum = "full_spectrum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slicer: end-to-end tests requiring a slicer binary (OrcaSlicer or BambuStudio)",
]
